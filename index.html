<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>Cine Gallery</title>


<style>

/* =================================================
   GENERAL
   ================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    font-family: Arial, sans-serif;

    background: #0f0f0f;

    color: white;

    min-height: 100vh;

}


/* =================================================
   SIDEBAR
   ================================================= */

.sidebar {

    position: fixed;

    left: 0;

    top: 0;

    width: 230px;

    height: 100vh;

    background: #151515;

    border-right: 1px solid #292929;

    padding: 30px 15px;

    display: flex;

    flex-direction: column;

    z-index: 100;

}


/* =================================================
   LOGO
   ================================================= */

.logo {

    text-align: center;

    margin-bottom: 40px;

}


.logo h1 {

    font-size: 27px;

    margin-bottom: 8px;

}


.logo p {

    color: #777;

    font-size: 12px;

}


/* =================================================
   NAVIGATION
   ================================================= */

.nav button {

    width: 100%;

    border: none;

    background: transparent;

    color: #999;

    padding: 14px 16px;

    margin-bottom: 8px;

    border-radius: 10px;

    text-align: left;

    font-size: 15px;

    cursor: pointer;

    transition: 0.2s;

}


.nav button:hover {

    background: #222;

    color: white;

}


.nav button.active {

    background: #2a2a2a;

    color: white;

}


/* =================================================
   STATS
   ================================================= */

.stats {

    margin-top: auto;

    border-top: 1px solid #292929;

    padding-top: 20px;

}


.stat {

    display: flex;

    justify-content: space-between;

    padding: 8px 5px;

    color: #777;

    font-size: 13px;

}


.stat strong {

    color: white;

}


/* =================================================
   MAIN
   ================================================= */

.main {

    margin-left: 230px;

    padding: 45px;

}


/* =================================================
   HEADER
   ================================================= */

.page-header {

    margin-bottom: 35px;

}


.page-header h2 {

    font-size: 32px;

    margin-bottom: 8px;

}


.page-header p {

    color: #777;

}


/* =================================================
   GALLERY
   ================================================= */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px, 1fr)
        );

    gap: 22px;

}


/* =================================================
   CARD
   ================================================= */

.card {

    background: #181818;

    padding: 8px;

    border-radius: 16px;

    overflow: hidden;

}


/* =================================================
   IMAGES
   ================================================= */

.card img {

    width: 100%;

    height: 350px;

    object-fit: cover;

    display: block;

    border-radius: 11px;

}


/* =================================================
   VIDEOS
   ================================================= */

.card video {

    width: 100%;

    height: 350px;

    object-fit: cover;

    display: block;

    border-radius: 11px;

    background: #000;

}


/* =================================================
   MOBILE
   ================================================= */

@media (max-width: 700px) {

    .sidebar {

        width: 75px;

        padding: 20px 8px;

    }


    .logo h1 {

        font-size: 0;

    }


    .logo h1::after {

        content: "🎬";

        font-size: 25px;

    }


    .logo p {

        display: none;

    }


    .nav button {

        text-align: center;

        padding: 13px 5px;

        font-size: 0;

    }


    .stats {

        display: none;

    }


    .main {

        margin-left: 75px;

        padding: 25px 15px;

    }


    .gallery {

        grid-template-columns: 1fr;

    }

}

</style>

</head>

<script>


function showSection(section, button) {{

    const photos =
        document.getElementById("photos");

    const videos =
        document.getElementById("videos");


    const title =
        document.getElementById("pageTitle");


    const description =
        document.getElementById(
            "pageDescription"
        );


    // Remove active state

    document
        .querySelectorAll(".nav button")
        .forEach(btn => {{

            btn.classList.remove("active");

        }});


    // Activate clicked button

    button.classList.add("active");


    // =================================================
    // PHOTOS
    // =================================================

    if (section === "photos") {{

        photos.style.display = "block";

        videos.style.display = "none";

        title.innerText = "Photos";

        description.innerText =
            "My photo collection";

    }}


    // =================================================
    // VIDEOS
    // =================================================

    if (section === "videos") {{

        photos.style.display = "none";

        videos.style.display = "block";

        title.innerText = "Videos";

        description.innerText =
            "My video collection";

    }}

}}

</script>
