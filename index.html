<title>Cine Gallery</title>

<style>


/* =================================================
   GENERAL
   ================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    font-family: Arial, sans-serif;

    background: #0f0f0f;

    color: white;

    min-height: 100vh;

}


/* =================================================
   SIDEBAR
   ================================================= */

.sidebar {

    position: fixed;

    left: 0;

    top: 0;

    width: 230px;

    height: 100vh;

    background: #151515;

    border-right: 1px solid #292929;

    padding: 30px 15px;

    display: flex;

    flex-direction: column;

    z-index: 100;

}


/* =================================================
   LOGO
   ================================================= */

.logo {

    text-align: center;

    margin-bottom: 40px;

}


.logo h1 {

    font-size: 27px;

    margin-bottom: 8px;

}


.logo p {

    color: #777;

    font-size: 12px;

}


/* =================================================
   NAVIGATION
   ================================================= */

.nav {

    overflow-y: auto;

}


.nav button {

    width: 100%;

    border: none;

    background: transparent;

    color: #999;

    padding: 14px 16px;

    margin-bottom: 8px;

    border-radius: 10px;

    text-align: left;

    font-size: 15px;

    cursor: pointer;

    transition: 0.2s;

}


.nav button:hover {

    background: #222;

    color: white;

}


.nav button.active {

    background: #2a2a2a;

    color: white;

}


/* =================================================
   STATS
   ================================================= */

.stats {

    margin-top: auto;

    border-top: 1px solid #292929;

    padding-top: 20px;

}


.stat {

    display: flex;

    justify-content: space-between;

    padding: 8px 5px;

    color: #777;

    font-size: 13px;

}


.stat strong {

    color: white;

}


/* =================================================
   MAIN
   ================================================= */

.main {

    margin-left: 230px;

    padding: 45px;

}


/* =================================================
   HEADER
   ================================================= */

.page-header {

    margin-bottom: 35px;

}


.page-header h2 {

    font-size: 32px;

    margin-bottom: 8px;

}


.page-header p {

    color: #777;

}


/* =================================================
   GALLERY
   ================================================= */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px, 1fr)
        );

    gap: 22px;

}


/* =================================================
   CARD
   ================================================= */

.card {

    background: #181818;

    padding: 8px;

    border-radius: 16px;

    overflow: hidden;

}


/* =================================================
   IMAGES
   ================================================= */

.card img {

    width: 100%;

    height: 350px;

    object-fit: cover;

    display: block;

    border-radius: 11px;

}


/* =================================================
   VIDEOS
   ================================================= */

.card video {

    width: 100%;

    height: 350px;

    object-fit: cover;

    display: block;

    border-radius: 11px;

    background: #000;

}


/* =================================================
   FOLDERS
   ================================================= */

.folder-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px, 1fr)
        );

    gap: 22px;

    margin-bottom: 35px;

}


.folder-card {

    background: #181818;

    padding: 25px;

    border-radius: 16px;

    border: 1px solid #292929;

    cursor: pointer;

    transition: 0.2s;

}


.folder-card:hover {

    background: #222;

    border-color: #444;

    transform: translateY(-3px);

}


.folder-icon {

    font-size: 45px;

    margin-bottom: 15px;

}


.folder-name {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 8px;

}


.folder-count {

    color: #777;

    font-size: 13px;

}


/* =================================================
   MOBILE
   ================================================= */

@media (max-width: 700px) {

    .sidebar {

        width: 75px;

        padding: 20px 8px;

    }


    .logo h1 {

        font-size: 0;

    }


    .logo h1::after {

        content: "🎬";

        font-size: 25px;

    }


    .logo p {

        display: none;

    }


    .nav button {

        text-align: center;

        padding: 13px 5px;

        font-size: 0;

    }


    .stats {

        display: none;

    }


    .main {

        margin-left: 75px;

        padding: 25px 15px;

    }


    .gallery {

        grid-template-columns: 1fr;

    }


    .folder-grid {

        grid-template-columns: 1fr;

    }

}


</style>

</head>

/* =================================================
   SHOW PHOTOS / VIDEOS
   ================================================= */

function showSection(section, button) {

    const photos =
        document.getElementById("photos");

    const videos =
        document.getElementById("videos");

    const customFolder =
        document.getElementById("customFolder");

    const title =
        document.getElementById("pageTitle");

    const description =
        document.getElementById("pageDescription");


    photos.style.display = "none";

    videos.style.display = "none";

    customFolder.style.display = "none";


    document
        .querySelectorAll(".nav button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    if (button) {

        button.classList.add("active");

    }


    /* ---------------------------------------------
       PHOTOS
       --------------------------------------------- */

    if (section === "photos") {

        photos.style.display = "block";

        title.innerText = "Photos";

        description.innerText =
            "My photo collection";

    }


    /* ---------------------------------------------
       VIDEOS
       --------------------------------------------- */

    if (section === "videos") {

        videos.style.display = "block";

        title.innerText = "Videos";

        description.innerText =
            "My video collection";

    }

}


/* =================================================
   SHOW CUSTOM FOLDER
   ================================================= */

function showCustomFolder(
    folderId,
    button = null
) {

    const photos =
        document.getElementById("photos");

    const videos =
        document.getElementById("videos");

    const customFolder =
        document.getElementById("customFolder");

    const folderContent =
        document.getElementById("folderContent");

    const title =
        document.getElementById("pageTitle");

    const description =
        document.getElementById("pageDescription");


    /* ---------------------------------------------
       Hide normal sections
       --------------------------------------------- */

    photos.style.display = "none";

    videos.style.display = "none";

    customFolder.style.display = "block";


    /* ---------------------------------------------
       Get folder name
       --------------------------------------------- */

    let decodedId = folderId;


    try {

        decodedId =
            decodeURIComponent(folderId);

    }

    catch (error) {

        decodedId =
            folderId;

    }


    const parts =
        decodedId.split("/");


    const folderName =
        parts[parts.length - 1];


    title.innerText =
        folderName;


    description.innerText =
        "Folder collection";


    /* ---------------------------------------------
       Show folder content
       --------------------------------------------- */

    if (folderData[folderId]) {

        folderContent.innerHTML =
            folderData[folderId];

    }

    else {

        folderContent.innerHTML = `
<p style="
    color:#777;
    padding:20px 0;
">
    This folder is empty.
</p>
`;

    }


    /* ---------------------------------------------
       Active sidebar button
       --------------------------------------------- */

    document
        .querySelectorAll(".nav button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    if (button) {

        button.classList.add("active");

    }

}
