<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cine Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    min-height: 100vh;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 270px;
    height: 100vh;
    background: #151515;
    border-right: 1px solid #292929;
    padding: 25px 14px;
    display: flex;
    flex-direction: column;
    z-index: 100;
    overflow-y: auto;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    font-size: 25px;
    margin-bottom: 7px;
}

.logo p {
    color: #777;
    font-size: 12px;
}

.nav button,
.folder-button {
    width: 100%;
    border: none;
    background: transparent;
    color: #999;
    padding: 12px 13px;
    margin-bottom: 5px;
    border-radius: 9px;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
}

.nav button:hover,
.folder-button:hover {
    background: #222;
    color: white;
}

.nav button.active,
.folder-button.active {
    background: #2a2a2a;
    color: white;
}

.section {
    margin-top: 18px;
}

.section-title {
    color: #666;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 12px;
}

.folder-tree {
    padding-left: 5px;
}

.folder-children {
    display: none;
    padding-left: 13px;
}

.folder-children.open {
    display: block;
}

.folder-row {
    display: flex;
    align-items: center;
    gap: 3px;
}

.folder-toggle {
    width: 28px;
    border: 0;
    background: transparent;
    color: #777;
    cursor: pointer;
    padding: 8px 0;
}

.folder-button {
    flex: 1;
    margin-bottom: 2px;
}

.stats {
    margin-top: auto;
    border-top: 1px solid #292929;
    padding-top: 15px;
}

.stat {
    display: flex;
    justify-content: space-between;
    padding: 7px 5px;
    color: #777;
    font-size: 12px;
}

.stat strong {
    color: white;
}

.main {
    margin-left: 270px;
    padding: 42px;
}

.page-header {
    margin-bottom: 30px;
}

.page-header h2 {
    font-size: 31px;
    margin-bottom: 7px;
}

.page-header p {
    color: #777;
}

.breadcrumb {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 14px;
    color: #666;
    font-size: 12px;
}

.breadcrumb span {
    color: #aaa;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
}

.card {
    background: #181818;
    padding: 8px;
    border-radius: 16px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    display: block;
    border-radius: 11px;
}

.card video {
    width: 100%;
    height: 350px;
    object-fit: cover;
    display: block;
    border-radius: 11px;
    background: #000;
}

.file-list {
    display: grid;
    gap: 10px;
    margin-top: 28px;
}

.file-card {
    background: #181818;
    border: 1px solid #242424;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.file-info {
    min-width: 0;
}

.file-name {
    font-size: 14px;
    overflow-wrap: anywhere;
}

.file-type {
    color: #666;
    font-size: 11px;
    margin-top: 4px;
    text-transform: uppercase;
}

.file-link {
    flex-shrink: 0;
    color: white;
    background: #292929;
    text-decoration: none;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 12px;
}

.file-link:hover {
    background: #3a3a3a;
}

.empty {
    color: #666;
    padding: 25px 0;
}

@media (max-width: 700px) {
    .sidebar {
        width: 78px;
        padding: 18px 7px;
    }

    .logo h1 {
        font-size: 0;
    }

    .logo h1::after {
        content: "🎬";
        font-size: 25px;
    }

    .logo p,
    .section-title,
    .stats,
    .folder-toggle {
        display: none;
    }

    .nav button,
    .folder-button {
        text-align: center;
        font-size: 0;
        padding: 12px 5px;
    }

    .folder-button::before {
        content: "📁";
        font-size: 18px;
    }

    .main {
        margin-left: 78px;
        padding: 25px 15px;
    }

    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<aside class="sidebar">

<div class="logo">
    <h1>🎬 Cine Gallery</h1>
    <p>My Collection</p>
</div>

<div class="nav">
    <button class="active" onclick="openLegacy('photos', this)">
        🖼️ &nbsp; Photos
    </button>

    <button onclick="openLegacy('videos', this)">
        🎥 &nbsp; Videos
    </button>
</div>

<div class="section">
    <div class="section-title">Collections</div>
    <div id="folderTree" class="folder-tree"></div>
</div>

<div class="stats">
    <div class="stat">
        <span>Total</span>
        <strong>456</strong>
    </div>
    <div class="stat">
        <span>Photos</span>
        <strong>223</strong>
    </div>
    <div class="stat">
        <span>Videos</span>
        <strong>219</strong>
    </div>
    <div class="stat">
        <span>Collection files</span>
        <strong>14</strong>
    </div>
</div>

</aside>

<main class="main">

<div class="page-header">
    <h2 id="pageTitle">Photos</h2>
    <p id="pageDescription">My photo collection</p>
    <div id="breadcrumb" class="breadcrumb"></div>
</div>

<div id="content"></div>

</main>

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function setActive(element) {
    document.querySelectorAll(".nav button, .folder-button")
        .forEach(x => x.classList.remove("active"));
    if (element) element.classList.add("active");
}

function renderMedia(files) {
    const content = document.getElementById("content");
    const media = files.filter(x => x.kind === "image" || x.kind === "video");
    const other = files.filter(x => x.kind !== "image" && x.kind !== "video");

    if (!media.length && !other.length) {
        content.innerHTML = '<div class="empty">This folder is empty.</div>';
        return;
    }

    let html = "";

    if (media.length) {
        html += '<div class="gallery">';

        media.forEach(item => {
            const url = fileUrl(item.path);

            if (item.kind === "image") {
                html += `
                <div class="card">
                    <img src="${url}" alt="${escapeHtml(item.name)}" loading="lazy">
                </div>`;
            } else {
                html += `
                <div class="card">
                    <video controls preload="none" playsinline>
                        <source src="${url}">
                        Your browser does not support video.
                    </video>
                </div>`;
            }
        });

        html += "</div>";
    }

    if (other.length) {
        html += '<div class="file-list">';

        other.forEach(item => {
            const url = fileUrl(item.path);
            const label =
                item.kind === "html" ? "HTML" :
                item.kind === "part" ? "PART / INCOMPLETE" :
                "FILE";

            html += `
            <div class="file-card">
                <div class="file-info">
                    <div class="file-name">${escapeHtml(item.name)}</div>
                    <div class="file-type">${label}</div>
                </div>
                <a class="file-link"
                   href="${url}"
                   target="_blank"
                   rel="noopener">
                   Open
                </a>
            </div>`;
        });

        html += "</div>";
    }

    content.innerHTML = html;
}

function setHeader(title, description, pathParts=[]) {
    document.getElementById("pageTitle").innerText = title;
    document.getElementById("pageDescription").innerText = description;

    const breadcrumb = document.getElementById("breadcrumb");

    if (!pathParts.length) {
        breadcrumb.innerHTML = "";
        return;
    }

    breadcrumb.innerHTML = pathParts
        .map(x => `<span>› ${escapeHtml(x)}</span>`)
        .join("");
}

function openLegacy(type, button) {
    setActive(button);

    if (type === "photos") {
        const files = legacyFiles.filter(x => x.kind === "image");
        setHeader("Photos", "My photo collection");
        renderMedia(files);
    } else {
        const files = legacyFiles.filter(x => x.kind === "video");
        setHeader("Videos", "My video collection");
        renderMedia(files);
    }
}

function findFolderByPath(root, targetPath) {
    if (root.path === targetPath) return root;

    for (const child of root.folders) {
        const found = findFolderByPath(child, targetPath);
        if (found) return found;
    }

    return null;
}

function openFolder(folder, button) {
    setActive(button);

    const allFiles = [...folder.files];

    // A folder page shows files directly inside it.
    // Subfolders are shown as folders in the sidebar.
    const parts = folder.path.split("/");

    setHeader(
        folder.name,
        "Folder contents",
        parts
    );

    renderMedia(allFiles);
}

function buildFolderNode(folder) {
    const wrapper = document.createElement("div");

    const row = document.createElement("div");
    row.className = "folder-row";

    const toggle = document.createElement("button");
    toggle.className = "folder-toggle";
    toggle.innerText = folder.folders.length ? "›" : "";

    const button = document.createElement("button");
    button.className = "folder-button";
    button.innerText = "📁 " + folder.name;

    button.onclick = () => openFolder(folder, button);

    row.appendChild(toggle);
    row.appendChild(button);
    wrapper.appendChild(row);

    if (folder.folders.length) {
        const children = document.createElement("div");
        children.className = "folder-children";

        folder.folders.forEach(child => {
            children.appendChild(buildFolderNode(child));
        });

        toggle.onclick = () => {
            children.classList.toggle("open");
            toggle.innerText =
                children.classList.contains("open") ? "⌄" : "›";
        };

        wrapper.appendChild(children);
    }

    return wrapper;
}

function buildSidebar() {
    const root = document.getElementById("folderTree");
    root.innerHTML = "";

    collections.forEach(collection => {
        root.appendChild(buildFolderNode(collection));
    });
}

buildSidebar();
openLegacy("photos", document.querySelector(".nav button"));
</script>
