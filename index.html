
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Cine Gallery</title>


<style>


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f0f0f,
            #1b1b1b
        );

    color: white;

    min-height: 100vh;

}


/* ==========================================
   HEADER
   ========================================== */

header {

    text-align: center;

    padding: 60px 20px 40px;

}


header h1 {

    font-size: 48px;

    letter-spacing: 2px;

    margin-bottom: 12px;

}


header p {

    color: #999;

    font-size: 17px;

}


/* ==========================================
   POST COUNT
   ========================================== */

.stats {

    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;

    margin-top: 20px;

}


.stat {

    display: inline-block;

    padding: 9px 18px;

    border-radius: 30px;

    background: #222;

    color: #aaa;

    font-size: 14px;

}


.stat strong {

    color: white;

    font-size: 16px;

}


/* ==========================================
   GALLERY
   ========================================== */

.gallery {

    width: 92%;

    max-width: 1400px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 25px;

    padding-bottom: 60px;

}


/* ==========================================
   CARD
   ========================================== */

.card {

    background: #191919;

    border-radius: 18px;

    padding: 10px;

    overflow: hidden;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

}


.card:hover {

    transform: translateY(-8px);

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.6);

}


/* ==========================================
   IMAGE / VIDEO
   ========================================== */

.card img,
.card video {

    width: 100%;

    height: 380px;

    object-fit: cover;

    border-radius: 12px;

    display: block;

}


/* ==========================================
   FOOTER
   ========================================== */

footer {

    text-align: center;

    padding: 30px;

    color: #666;

}


/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 600px) {

    header h1 {

        font-size: 34px;

    }

    .gallery {

        width: 94%;

        grid-template-columns: 1fr;

    }

    .card img,
    .card video {

        height: auto;

    }

}


</style>

</head>
