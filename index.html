<title>Cine Gallery</title>


<style>

/* ==========================================
   GENERAL
   ========================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family: Arial, sans-serif;

    background: #0f0f0f;

    color: white;

    min-height: 100vh;

}


/* ==========================================
   SIDEBAR
   ========================================== */

.sidebar {

    position: fixed;

    left: 0;
    top: 0;

    width: 230px;

    height: 100vh;

    background: #151515;

    border-right: 1px solid #292929;

    padding: 30px 15px;

    display: flex;

    flex-direction: column;

}


/* LOGO */

.logo {

    text-align: center;

    margin-bottom: 40px;

}

.logo h1 {

    font-size: 27px;

    margin-bottom: 8px;

}

.logo p {

    color: #777;

    font-size: 12px;

}


/* ==========================================
   NAVIGATION
   ========================================== */

.nav button {

    width: 100%;

    border: none;

    background: transparent;

    color: #999;

    padding: 14px 16px;

    margin-bottom: 8px;

    border-radius: 10px;

    text-align: left;

    font-size: 15px;

    cursor: pointer;

    transition: 0.25s;

}


.nav button:hover {

    background: #222;

    color: white;

}


.nav button.active {

    background: #2a2a2a;

    color: white;

}


/* ==========================================
   STATS
   ========================================== */

.stats {

    margin-top: auto;

    border-top: 1px solid #292929;

    padding-top: 20px;

}


.stat {

    display: flex;

    justify-content: space-between;

    padding: 8px 5px;

    color: #777;

    font-size: 13px;

}


.stat strong {

    color: white;

}


/* ==========================================
   MAIN CONTENT
   ========================================== */

.main {

    margin-left: 230px;

    padding: 45px;

}


/* HEADER */

.page-header {

    margin-bottom: 35px;

}

.page-header h2 {

    font-size: 32px;

    margin-bottom: 8px;

}

.page-header p {

    color: #777;

}


/* ==========================================
   GALLERY
   ========================================== */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px, 1fr)
        );

    gap: 22px;

}


/* CARD */

.card {

    background: #181818;

    padding: 8px;

    border-radius: 16px;

    overflow: hidden;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

}


.card:hover {

    transform: translateY(-6px);

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.5);

}


/* MEDIA */

.card img,
.card video {

    width: 100%;

    height: 350px;

    object-fit: cover;

    display: block;

    border-radius: 11px;

}


/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 700px) {

    .sidebar {

        width: 75px;

        padding: 20px 8px;

    }

    .logo h1 {

        font-size: 0;

    }

    .logo h1::after {

        content: "🎬";

        font-size: 25px;

    }

    .logo p {

        display: none;

    }

    .nav button {

        text-align: center;

        padding: 13px 5px;

        font-size: 0;

    }

    .nav button::first-letter {

        font-size: 20px;

    }

    .stats {

        display: none;

    }

    .main {

        margin-left: 75px;

        padding: 25px 15px;

    }

    .gallery {

        grid-template-columns: 1fr;

    }

}

</style>

</head>

<script>


function showMedia(type, button) {


    // Get all cards

    const cards =
        document.querySelectorAll(".card");


    // Remove active from buttons

    document
        .querySelectorAll(".nav button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    // Activate clicked button

    button.classList.add("active");


    // Page title

    const title =
        document.getElementById("pageTitle");


    const description =
        document.getElementById("pageDescription");


    // Show everything

    if (type === "all") {


        cards.forEach(card => {

            card.style.display = "block";

        });


        title.innerText = "All Posts";

        description.innerText =
            "All photos and videos";

    }


    // Show images

    else if (type === "image") {


        cards.forEach(card => {

            if (
                card.classList.contains(
                    "media-image"
                )
            ) {

                card.style.display = "block";

            }

            else {

                card.style.display = "none";

            }

        });


        title.innerText = "Images";

        description.innerText =
            "My photo collection";

    }


    // Show videos

    else if (type === "video") {


        cards.forEach(card => {

            if (
                card.classList.contains(
                    "media-video"
                )
            ) {

                card.style.display = "block";

            }

            else {

                card.style.display = "none";

            }

        });


        title.innerText = "Videos";

        description.innerText =
            "My video collection";

    }

}


</script>
